endpoint: /checks/monitor
check: monitor
summary: Whether the watcher is still sampling on its own, and what each of its probes last measured.
identity:
  kind: postgres_role
  name: nfl_check_monitor
  scope: >
    NFL Postgres as the dedicated read-only role nfl_check_monitor. Reads
    observability.monitor_sample and nothing else.
credential_env: SHIM_MONITOR_PG_DSN
dependencies:
  - nfl_postgres
grants:
  - "CREATE ROLE nfl_check_monitor LOGIN PASSWORD '<secret>';"
  - "GRANT CONNECT ON DATABASE nfl TO nfl_check_monitor;"
  - "GRANT USAGE ON SCHEMA observability TO nfl_check_monitor;"
  - "ALTER ROLE nfl_check_monitor SET default_transaction_read_only = on;"
  - "GRANT SELECT ON observability.monitor_sample TO nfl_check_monitor;"
grants_rationale: >
  The verdict is the newest sample of each probe and its age. The samples hold
  connector states and heartbeat ages, no pipeline data, so the whole table is
  granted and nothing outside it.
local_enforcement: >
  ENFORCED by Postgres when the DSN in $SHIM_MONITOR_PG_DSN logs in as nfl_check_monitor with
  exactly the grants above: the role authenticates with its own password, can SELECT
  only what is listed, and cannot write. The shim refuses to start if that DSN
  carries any other user, or a user another endpoint also carries. NOT verified by the
  shim: that the database holds no EXTRA grant for this role; that is the DDL's job
  (infra/sql) and is audited with \dp, not by this service.
aws_iam_policy:
  Version: "2012-10-17"
  Statement:
    - Sid: ConnectAsMonitorRole
      Effect: Allow
      Action:
        - rds-db:connect
      Resource:
        - arn:aws:rds-db:${AWS_REGION}:${AWS_ACCOUNT_ID}:dbuser:${NFL_PG_RESOURCE_ID}/nfl_check_monitor
    - Sid: ReadOwnSecret
      Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - arn:aws:secretsmanager:${AWS_REGION}:${AWS_ACCOUNT_ID}:secret:nfl/shim/monitor-*
