# Ships the stack's logs to CloudWatch Logs (floci locally), so a log line is
# one signed HTTP request away instead of a `docker logs` on the host.
#
#   container stdout/stderr  ->  /nfl/<container name>   stream: stdout | stderr
#   Airflow task log files   ->  /nfl/airflow-tasks      stream: <dag id>
#
# Local stand-in only. In AWS each service writes to CloudWatch Logs through its
# own log driver or agent and this container does not exist.
data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  containers:
    type: docker_logs
    include_containers: ["nfl-"]
    # Its own log would describe every batch it ships, which would be shipped,
    # which it would describe.
    exclude_containers: ["nfl-logship"]

  airflow_tasks:
    type: file
    include:
      - /airflow-logs/dag_id=*/run_id=*/task_id=*/attempt=*.log
    read_from: beginning
    ignore_older_secs: 86400

transforms:
  container_lines:
    type: remap
    inputs: [containers]
    source: |
      .component = string!(.container_name)
      .log_stream = string(.stream) ?? "stdout"

  task_lines:
    type: remap
    inputs: [airflow_tasks]
    source: |
      parts, err = parse_regex(.file, r'dag_id=(?P<dag>[^/]+)/run_id=(?P<run>[^/]+)/task_id=(?P<task>[^/]+)/attempt=(?P<attempt>\d+)\.log$')
      if err != null {
        parts = {"dag": "unparsed", "run": "", "task": "", "attempt": ""}
      }
      .component = "airflow-tasks"
      .log_stream = parts.dag
      .message = join!([parts.task, " try=", parts.attempt, " run=", parts.run, " | ", string!(.message)])

sinks:
  cloudwatch:
    type: aws_cloudwatch_logs
    inputs: [container_lines, task_lines]
    # Literal on purpose. Vector 0.59 no longer expands ${VAR} in this file
    # unless started with --dangerously-allow-env-var-interpolation, and these
    # three values are the same on every local stack. Change them here.
    endpoint: http://host.docker.internal:4566
    region: us-east-1
    group_name: "/nfl/{{ component }}"
    stream_name: "{{ log_stream }}"
    create_missing_group: true
    create_missing_stream: true
    encoding:
      codec: text
    # No auth block: the key pair comes from AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY in the container's environment, so no credential is
    # written in this file.
    batch:
      timeout_secs: 2
