name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    name: offline checks (no floci, no full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python sources compile
        run: python3 -m compileall -q docs infra/airflow/dags scripts shim stub watch

      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh infra/mysql/init/*.sh infra/sql/*.sh infra/sftp/*.sh; do
            bash -n "$f"
          done

      - name: Coverage doc matches its own tables and the Bruno files
        run: python3 docs/check_coverage.py --check

      - name: Compose file is valid against the committed env template
        run: docker compose --project-directory infra -f infra/docker-compose.yml --env-file infra/env.example.txt config --quiet

      - name: DMS stub self-test (in the image it ships in)
        run: |
          docker build -t nfl-dms-stub stub
          docker run --rm nfl-dms-stub python selftest.py | tee /tmp/selftest.log
          grep -q '^0 failure(s)$' /tmp/selftest.log

  secrets-scan:
    name: secrets scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          v=8.30.1
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks

      - name: Scan working tree and git history
        run: ./gitleaks detect --source . --redact --no-banner --verbose
